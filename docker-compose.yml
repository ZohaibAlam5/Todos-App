# TaskFlow Docker Compose Configuration
# Run with: docker-compose up --build
# Production builds: docker-compose -f docker-compose.yml up --build

services:
  # ==========================================================================
  # Frontend Service - Next.js Application
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Backend Service - FastAPI Application
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: taskflow-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./test.db}
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@taskflow.com}
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # MCP Server Service - Tool Server for AI Agents
  # ==========================================================================
  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile
      target: development
    container_name: taskflow-mcp-server
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - MCP_PORT=8001
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# =============================================================================
# Networks
# =============================================================================
networks:
  taskflow-network:
    driver: bridge
    name: taskflow-network
