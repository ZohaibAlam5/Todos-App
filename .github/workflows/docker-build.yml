# TaskFlow Docker Build and Push Workflow
# Builds production Docker images and pushes to GitHub Container Registry

name: Docker Build and Push

on:
  push:
    branches:
      - main
      - master
      - '003-cloud-deployment-k8s'
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mcp-server/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mcp-server/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  # Repository owner in lowercase (required for ghcr.io)
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ==========================================================================
  # Build Job - Matrix build for all services
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            dockerfile: docker/frontend/Dockerfile
            context: .
          - name: backend
            dockerfile: docker/backend/Dockerfile
            context: .
          - name: mcp-server
            dockerfile: docker/mcp-server/Dockerfile
            context: .

    steps:
      # --------------------------------------------------------------------
      # Checkout and Setup
      # --------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------------------
      # Authentication
      # --------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------
      # Metadata for Tags and Labels
      # --------------------------------------------------------------------
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/taskflow-${{ matrix.service.name }}
          tags: |
            # Branch name
            type=ref,event=branch
            # PR number
            type=ref,event=pr
            # Git SHA (short)
            type=sha,prefix=sha-
            # Git SHA (full) for production deployments
            type=raw,value={{sha}}
            # Latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TaskFlow ${{ matrix.service.name }}
            org.opencontainers.image.description=TaskFlow ${{ matrix.service.name }} service
            org.opencontainers.image.vendor=TaskFlow

      # --------------------------------------------------------------------
      # Build and Push
      # --------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # --------------------------------------------------------------------
      # Output image digest for verification
      # --------------------------------------------------------------------
      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "## ${{ matrix.service.name }} Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Summary Job - Outputs all built images
  # ==========================================================================
  summary:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Create deployment summary
        run: |
          echo "## Docker Images Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following images have been pushed to GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.IMAGE_PREFIX }}/taskflow-frontend:sha-${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.IMAGE_PREFIX }}/taskflow-backend:sha-${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Server | \`${{ env.IMAGE_PREFIX }}/taskflow-mcp-server:sha-${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy to Kubernetes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Update the image tags in your Kubernetes manifests:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/taskflow-frontend frontend=${{ env.IMAGE_PREFIX }}/taskflow-frontend:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/taskflow-backend backend=${{ env.IMAGE_PREFIX }}/taskflow-backend:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/taskflow-mcp-server mcp-server=${{ env.IMAGE_PREFIX }}/taskflow-mcp-server:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
