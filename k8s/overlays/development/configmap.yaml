apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  labels:
    app: taskflow
    environment: development
data:
  # Application environment
  ENVIRONMENT: "development"
  LOG_LEVEL: "DEBUG"

  # Service URLs for inter-service communication
  API_URL: "http://taskflow-backend:8000"
  FRONTEND_URL: "http://taskflow-frontend"
  BACKEND_URL: "http://taskflow-backend:8000"

  # CORS configuration
  CORS_ORIGINS: "*"
  ALLOWED_ORIGINS: "http://localhost:3000,http://taskflow-frontend"

  # MCP Server configuration
  MCP_PORT: "8001"

  # Frontend configuration
  NEXT_PUBLIC_API_URL: "http://taskflow-backend:8000"
  NEXT_TELEMETRY_DISABLED: "1"
