apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-mcp-server
  labels:
    app: taskflow
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      component: mcp-server
  template:
    metadata:
      labels:
        app: taskflow
        component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/OWNER/taskflow-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: MCP_PORT
              value: "8001"
            - name: BACKEND_URL
              value: "http://taskflow-backend:8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
