apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
  labels:
    app: taskflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Frontend - serves all non-API routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-frontend
                port:
                  number: 80
          # Backend API - /api, /auth, /tasks, /health endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend
                port:
                  number: 8000
          - path: /tasks
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: taskflow-backend
                port:
                  number: 8000
          # MCP Server - /mcp endpoint for AI tool access
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: taskflow-mcp-server
                port:
                  number: 8001
